<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Portal | Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="auth-shell">
    <section class="login-box" aria-labelledby="login-title">
    <img src="Adidas.jpeg" alt="Profile Picture">
    <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter your username" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <button type="submit">Login to dashboard</button>
    </form>
    <p id="loginMessage" class="error" aria-live="polite"></p>
    <a href="Register.html" class="register">Create a new account</a>
</section>
</main>

</body>
</html>
